name: Build Titan Audio Repair (persistent signing)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "signing/**"
      - ".github/workflows/build-v1.1.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_PASSWORD: ${{ secrets.TITAN_SIGNING_PASSWORD }}
      SIGNING_ALIAS: titanrepair
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.1"

      - name: Restore persistent release keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_PASSWORD:-}" ]; then
            echo "::error::Repository secret TITAN_SIGNING_PASSWORD is missing. Refusing to generate a new signing key."
            exit 20
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000             -in signing/TitanAudioRepair-release.p12.enc             -out "$RUNNER_TEMP/TitanAudioRepair-release.p12"             -pass pass:"$SIGNING_PASSWORD"

      - name: Build with persistent signing key
        shell: bash
        env:
          KEYSTORE: ${{ runner.temp }}/TitanAudioRepair-release.p12
          KEY_ALIAS: ${{ env.SIGNING_ALIAS }}
          KEYSTORE_PASS: ${{ env.SIGNING_PASSWORD }}
          KEY_PASS: ${{ env.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x app/build.sh
          app/build.sh "$ANDROID_SDK_ROOT"

      - name: Package and verify
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -- '--version-name' app/build.sh | awk '{print $2}')"
          SIGNED="app/out/TitanAudioRepair-${VERSION}-signed.apk"
          test -f "$SIGNED"

          mkdir -p releases
          cp "$SIGNED" "releases/TitanAudioRepair-${VERSION}-Elite-release.apk"
          rm -f "releases/TitanAudioRepair-${VERSION}-Elite-source.zip"
          zip -qr "releases/TitanAudioRepair-${VERSION}-Elite-source.zip" app             -x "app/out/*" "app/signing/*" "*.jks" "*.keystore" "*.p12"

          "$ANDROID_SDK_ROOT/build-tools/35.0.1/apksigner" verify --verbose --print-certs             "releases/TitanAudioRepair-${VERSION}-Elite-release.apk"             > "releases/TitanAudioRepair-${VERSION}-SIGNATURE.txt"

          {
            sha256sum "releases/TitanAudioRepair-${VERSION}-Elite-release.apk"
            sha256sum "releases/TitanAudioRepair-${VERSION}-Elite-source.zip"
          } > "releases/TitanAudioRepair-${VERSION}-SHA256.txt"

          EXPECTED_CERT="$(keytool -printcert -file signing/TitanAudioRepair-release-cert.pem | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':')"
          ACTUAL_CERT="$(grep 'certificate SHA-256 digest:' "releases/TitanAudioRepair-${VERSION}-SIGNATURE.txt" | awk '{print $NF}')"
          if [ -n "$EXPECTED_CERT" ] && [ "${EXPECTED_CERT,,}" != "${ACTUAL_CERT,,}" ]; then
            echo "::error::APK signer certificate does not match persistent release certificate"
            exit 21
          fi

      - name: Commit release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -- '--version-name' app/build.sh | awk '{print $2}')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/TitanAudioRepair-${VERSION}-"*
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Build Titan Audio Repair ${VERSION} with persistent signing key"
          git push
