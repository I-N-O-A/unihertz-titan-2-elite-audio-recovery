name: Publish verified APK and source ZIP

on:
  push:
    paths:
      - ".github/apk_chunks/**"
      - ".github/workflows/publish-build.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct tested APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          cat .github/apk_chunks/part-* | tr -d '\n\r' | base64 -d > releases/TitanAudioRepair-1.0-Elite-release.apk
          echo "f846268dd8c4dc30b406cb093ca57dfc5183f5e3e10381a3894c1a06e41975b2  releases/TitanAudioRepair-1.0-Elite-release.apk" | sha256sum -c -

      - name: Create clean source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f releases/TitanAudioRepair-1.0-Elite-source.zip
          zip -qr releases/TitanAudioRepair-1.0-Elite-source.zip app             -x 'app/out/*' 'app/signing/*' '*.jks' '*.keystore'

      - name: Write checksums
        shell: bash
        run: |
          {
            sha256sum releases/TitanAudioRepair-1.0-Elite-release.apk
            sha256sum releases/TitanAudioRepair-1.0-Elite-source.zip
          } > releases/SHA256SUMS.txt

      - name: Remove transport chunks
        run: rm -rf .github/apk_chunks

      - name: Commit verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases .github/apk_chunks
          git commit -m "Publish verified APK and source ZIP"
          git push
